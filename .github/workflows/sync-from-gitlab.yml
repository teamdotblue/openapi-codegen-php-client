name: Sync from GitLab (public snapshot)

# Replaces the GitLab push mirror. The public repository intentionally does
# NOT contain the internal git history: every sync creates a new snapshot
# commit of the GitLab `main` tree, and publishes the newest tag of each
# major release line as a snapshot tag. Feature branches are not mirrored.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitlab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main and release tags from GitLab
        env:
          GITLAB_HOST: gitlab.group.team.blue
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, tarfile, tempfile, urllib.request

          host = os.environ["GITLAB_HOST"]
          project_id = os.environ["GITLAB_PROJECT_ID"]
          token = os.environ["GITLAB_TOKEN"]
          api = f"https://{host}/api/v4"

          def api_get(path, raw=False):
              req = urllib.request.Request(f"{api}{path}", headers={"Private-Token": token})
              with urllib.request.urlopen(req) as r:
                  return r.read() if raw else json.loads(r.read())

          def run(*args, check=True):
              return subprocess.run(args, check=check, capture_output=True, text=True)

          def sanitize(dirpath):
              """Strip internal info that must not be public."""
              cj = os.path.join(dirpath, "composer.json")
              if os.path.exists(cj):
                  with open(cj) as f:
                      data = json.load(f)
                  if "repositories" in data:
                      del data["repositories"]
                      with open(cj, "w") as f:
                          json.dump(data, f, indent=4, ensure_ascii=False)
                          f.write("\n")
              lock = os.path.join(dirpath, "composer.lock")
              if os.path.exists(lock):
                  os.remove(lock)

          def extract_tree(ref):
              """Download GitLab archive for ref, extract, return tree dir."""
              blob = api_get(f"/projects/{project_id}/repository/archive?sha={ref}&format=tar.gz", raw=True)
              tmp = tempfile.mkdtemp()
              tgz = os.path.join(tmp, "a.tar.gz")
              with open(tgz, "wb") as f:
                  f.write(blob)
              with tarfile.open(tgz) as tf:
                  tf.extractall(tmp)
              entries = [e for e in os.listdir(tmp) if e != "a.tar.gz"]
              return os.path.join(tmp, entries[0])

          # ---------- 1) sync main ----------
          main_sha = api_get(f"/projects/{project_id}/repository/commits?ref_name=main&per_page=1")[0]["id"]
          src = extract_tree("main")
          sanitize(src)
          # preserve repo-own files (.github) not present in GitLab
          if os.path.isdir(".github"):
              subprocess.run(["cp", "-a", ".github", os.path.join(src, ".github")])
          # replace working tree content (keep .git)
          subprocess.run(["rsync", "-a", "--delete", "--exclude", ".git", f"{src}/", "./"], check=True)
          run("git", "add", "-A")
          if run("git", "diff", "--cached", "--quiet", check=False).returncode != 0:
              msg = f"chore: sync snapshot of internal main ({main_sha[:12]})"
              run("git", "commit", "-m", msg)
              run("git", "push", "origin", "main")
              print(f"main updated -> {msg}")
          else:
              print("main already up to date")

          # ---------- 2) publish latest tag per major line ----------
          def vkey(v):
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", v)
              return (int(m.group(1)), int(m.group(2)), int(m.group(3))) if m else None

          # paginate through ALL tags
          names, page = [], 1
          while True:
              batch = api_get(f"/projects/{project_id}/repository/tags?per_page=100&page={page}")
              if not batch:
                  break
              names.extend(t["name"] for t in batch)
              page += 1

          latest_per_major = {}
          for name in names:
              k = vkey(name)
              if not k:
                  continue
              major = k[0]
              if major not in latest_per_major or k > vkey(latest_per_major[major]):
                  latest_per_major[major] = name

          existing = set()
          out = run("git", "ls-remote", "--tags", "origin", check=False).stdout
          for line in out.splitlines():
              existing.add(line.split()[-1].rsplit("/", 1)[-1].replace("^{}", ""))

          for major in sorted(latest_per_major):
              tag = latest_per_major[major]
              if tag in existing:
                  print(f"tag {tag}: already published")
                  continue
              src_tag = extract_tree(tag)
              sanitize(src_tag)
              run("git", "checkout", "--orphan", f"rel-{tag}")
              run("git", "rm", "-rq", "--cached", ".", check=False)
              run("git", "clean", "-qfdx", check=False)
              subprocess.run(["rsync", "-a", "--delete", "--exclude", ".git", f"{src_tag}/", "./"], check=True)
              run("git", "add", "-A")
              run("git", "commit", "-m", f"Release {tag}\n\nPublic snapshot of internal release {tag}.")
              run("git", "tag", "-f", "-a", tag, "-m", f"Release {tag} (public snapshot of team.blue internal release)")
              run("git", "push", "origin", f"refs/tags/{tag}")
              run("git", "checkout", "main")
              run("git", "branch", "-D", f"rel-{tag}", check=False)
              print(f"tag {tag}: published")
          print("SYNC DONE")
          PYEOF
